<svg xmlns="http://www.w3.org/2000/svg" width="860" height="940" viewBox="0 0 860 940" role="img" aria-labelledby="title desc">
  <title id="title">InfraPilot project flow</title>
  <desc id="desc">A compact top-to-bottom view of code, tests, AWS provisioning, deployment and runtime.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:27px;font-weight:700}.subtitle{font-size:14px;fill:#64748b}.label{font-size:16px;font-weight:700}.detail{font-size:13px;fill:#526174}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="860" height="940" fill="#fff"/>
  <text x="430" y="48" text-anchor="middle" class="title">InfraPilot | Project flow</text>
  <text x="430" y="75" text-anchor="middle" class="subtitle">From a code change to a running AWS service</text>

  <g fill="#fff" stroke="#94a3b8" stroke-width="1.8">
    <rect x="155" y="112" width="550" height="82" rx="12"/>
    <rect x="155" y="238" width="550" height="82" rx="12"/>
    <rect x="155" y="364" width="550" height="82" rx="12"/>
    <rect x="155" y="490" width="550" height="82" rx="12"/>
    <rect x="155" y="616" width="550" height="82" rx="12"/>
    <rect x="155" y="742" width="550" height="112" rx="12"/>
  </g>
  <rect x="155" y="238" width="550" height="82" rx="12" fill="#f7fff9" stroke="#4c9b70" stroke-width="1.8"/>
  <rect x="155" y="364" width="550" height="82" rx="12" fill="#f8f6ff" stroke="#8972bd" stroke-width="1.8"/>
  <rect x="155" y="490" width="550" height="82" rx="12" fill="#f7fbff" stroke="#5b8fc4" stroke-width="1.8"/>
  <rect x="155" y="742" width="550" height="112" rx="12" fill="#f8fbff" stroke="#5b8fc4" stroke-width="1.8"/>

  <text x="430" y="145" text-anchor="middle" class="label">1. Change code and push to GitHub</text>
  <text x="430" y="168" text-anchor="middle" class="detail">Application and infrastructure files are version controlled</text>
  <text x="430" y="271" text-anchor="middle" class="label">2. GitHub Actions runs pytest</text>
  <text x="430" y="294" text-anchor="middle" class="detail">Automated checks validate the application</text>
  <text x="430" y="397" text-anchor="middle" class="label">3. Terraform provisions AWS resources</text>
  <text x="430" y="420" text-anchor="middle" class="detail">Network, EC2, ECR, private RDS, IAM and secrets</text>
  <text x="430" y="523" text-anchor="middle" class="label">4. Build the Docker image and publish it to ECR</text>
  <text x="430" y="546" text-anchor="middle" class="detail">The image is versioned for deployment</text>
  <text x="430" y="649" text-anchor="middle" class="label">5. EC2 pulls the image and starts the service</text>
  <text x="430" y="672" text-anchor="middle" class="detail">Nginx reverse proxy and FastAPI application</text>
  <text x="430" y="781" text-anchor="middle" class="label">6. Requests and diagnostics are handled</text>
  <text x="430" y="806" text-anchor="middle" class="detail">Public GET /health returns service health</text>
  <text x="430" y="829" text-anchor="middle" class="detail">Administrator uses SSM; diagnostic history is stored in private RDS</text>

  <path d="M430 194V238M430 320V364M430 446V490M430 572V616M430 698V742" class="arrow"/>
  <text x="430" y="900" text-anchor="middle" class="subtitle">Monitoring and Kubernetes are used for local validation.</text>
</svg>
