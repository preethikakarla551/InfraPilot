<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">InfraPilot project flowchart</title>
  <desc id="desc">Plain top-to-bottom flowchart for code delivery, AWS deployment, health checks, and private diagnostics.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526579"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:31px;font-weight:700}.subtitle{font-size:15px;fill:#526174}.section{font-size:18px;font-weight:700}.label{font-size:16px;font-weight:700}.detail{font-size:13px;fill:#526174}.small{font-size:12px;fill:#526174}.arrow{fill:none;stroke:#526579;stroke-width:2.4;marker-end:url(#arrow)}.blue{fill:none;stroke:#2563eb;stroke-width:2.5;marker-end:url(#blueArrow)}
    </style>
  </defs>
  <rect width="1200" height="1600" fill="#fff"/>
  <text x="55" y="58" class="title">InfraPilot | Project flowchart</text>
  <text x="55" y="88" class="subtitle">Code delivery, AWS deployment, health checks and private diagnostics</text>

  <!-- Main delivery path, top to bottom -->
  <g fill="#fff" stroke="#64748b" stroke-width="2">
    <rect x="380" y="125" width="440" height="72" rx="12"/>
    <rect x="380" y="232" width="440" height="72" rx="12"/>
  </g>
  <rect x="380" y="339" width="440" height="72" rx="12" fill="#f7fff9" stroke="#218a5b" stroke-width="2"/>
  <text x="600" y="157" text-anchor="middle" class="label">Developer updates code and configuration</text>
  <text x="600" y="179" text-anchor="middle" class="detail">Application, tests and infrastructure files</text>
  <text x="600" y="264" text-anchor="middle" class="label">Commit and push changes to GitHub</text>
  <text x="600" y="286" text-anchor="middle" class="detail">Project source is version controlled</text>
  <text x="600" y="371" text-anchor="middle" class="label">GitHub Actions runs automated tests</text>
  <text x="600" y="393" text-anchor="middle" class="detail">Pytest checks the application</text>

  <path d="M600 197V232M600 304V339M600 411V420" class="arrow"/>
  <polygon points="600,420 722,470 600,520 478,470" fill="#fffbea" stroke="#cc9b19" stroke-width="2"/>
  <text x="600" y="476" text-anchor="middle" class="label">Tests pass?</text>

  <rect x="865" y="433" width="270" height="74" rx="12" fill="#fff8f8" stroke="#c94c4c" stroke-width="2"/>
  <text x="1000" y="462" text-anchor="middle" class="label">Fix and commit again</text>
  <text x="1000" y="484" text-anchor="middle" class="detail">Then CI runs the tests again</text>
  <path d="M722 470H865" class="arrow"/>
  <text x="790" y="456" text-anchor="middle" class="small">NO</text>
  <path d="M1000 433V205H820" class="arrow"/>
  <text x="1007" y="222" text-anchor="middle" class="small">RETRY</text>

  <g fill="#fbf9ff" stroke="#7653b5" stroke-width="2">
    <rect x="380" y="555" width="440" height="72" rx="12"/>
    <rect x="380" y="662" width="440" height="72" rx="12"/>
  </g>
  <rect x="380" y="769" width="440" height="72" rx="12" fill="#f7fbff" stroke="#2376b7" stroke-width="2"/>
  <rect x="380" y="876" width="440" height="72" rx="12" fill="#fffaf2" stroke="#ed8b24" stroke-width="2"/>
  <rect x="380" y="983" width="440" height="72" rx="12" fill="#f7fff9" stroke="#218a5b" stroke-width="2"/>
  <text x="600" y="583" text-anchor="middle" class="label">Terraform provisions base AWS resources</text>
  <text x="600" y="605" text-anchor="middle" class="detail">VPC, security groups, ECR, RDS, IAM and secrets</text>
  <text x="600" y="690" text-anchor="middle" class="label">Build the Docker image and push it to ECR</text>
  <text x="600" y="712" text-anchor="middle" class="detail">Publish a versioned application image</text>
  <text x="600" y="797" text-anchor="middle" class="label">Terraform deploys the application host</text>
  <text x="600" y="819" text-anchor="middle" class="detail">Enable the EC2 application deployment</text>
  <text x="600" y="904" text-anchor="middle" class="label">EC2 pulls the image and retrieves DB credentials</text>
  <text x="600" y="926" text-anchor="middle" class="detail">Its instance role grants access to required AWS services</text>
  <text x="600" y="1011" text-anchor="middle" class="label">Nginx and FastAPI start on EC2</text>
  <text x="600" y="1033" text-anchor="middle" class="detail">Nginx listens publicly on HTTP port 80</text>
  <path d="M600 520V555" class="blue"/><path d="M600 627V662M600 734V769M600 841V876M600 948V983" class="arrow"/>

  <!-- Runtime splits into the public health route and private admin route -->
  <path d="M600 1055V1082H310V1117M600 1082H890V1117" class="arrow"/>
  <text x="310" y="1110" text-anchor="middle" class="section">PUBLIC HEALTH CHECK</text>
  <text x="890" y="1110" text-anchor="middle" class="section">PRIVATE OPERATIONS</text>

  <g fill="#fff" stroke="#64748b" stroke-width="2">
    <rect x="105" y="1140" width="410" height="70" rx="12"/>
    <rect x="105" y="1240" width="410" height="70" rx="12"/>
    <rect x="105" y="1340" width="410" height="70" rx="12"/>
  </g>
  <rect x="105" y="1440" width="410" height="70" rx="12" fill="#f7fff9" stroke="#218a5b" stroke-width="2"/>
  <text x="310" y="1168" text-anchor="middle" class="label">Browser requests GET /health</text><text x="310" y="1190" text-anchor="middle" class="detail">Public HTTP request</text>
  <text x="310" y="1268" text-anchor="middle" class="label">Security group allows TCP port 80</text><text x="310" y="1290" text-anchor="middle" class="detail">Web traffic reaches Nginx</text>
  <text x="310" y="1368" text-anchor="middle" class="label">Nginx permits only GET /health</text><text x="310" y="1390" text-anchor="middle" class="detail">Other public API routes return 404</text>
  <text x="310" y="1468" text-anchor="middle" class="label">FastAPI returns HTTP 200</text><text x="310" y="1490" text-anchor="middle" class="detail">Health status JSON confirms the response</text>
  <path d="M310 1210V1240M310 1310V1340M310 1410V1440" class="arrow"/>

  <g fill="#fff8fb" stroke="#bc1356" stroke-width="2"><rect x="685" y="1140" width="410" height="70" rx="12"/></g>
  <g fill="#f5fffd" stroke="#009688" stroke-width="2"><rect x="685" y="1240" width="410" height="70" rx="12"/></g>
  <g fill="#fdf8ff" stroke="#c925d1" stroke-width="2"><rect x="685" y="1340" width="410" height="70" rx="12"/></g>
  <g fill="#fff" stroke="#64748b" stroke-width="2"><rect x="685" y="1440" width="410" height="70" rx="12"/></g>
  <text x="890" y="1168" text-anchor="middle" class="label">Administrator opens an SSM session</text><text x="890" y="1190" text-anchor="middle" class="detail">No inbound SSH access is configured</text>
  <text x="890" y="1268" text-anchor="middle" class="label">Call the private /diagnostics endpoint</text><text x="890" y="1290" text-anchor="middle" class="detail">Collect CPU, memory, disk and uptime data</text>
  <text x="890" y="1368" text-anchor="middle" class="label">Save a snapshot to private RDS</text><text x="890" y="1390" text-anchor="middle" class="detail">MySQL stores diagnostic history</text>
  <text x="890" y="1468" text-anchor="middle" class="label">Call /history to review snapshots</text><text x="890" y="1490" text-anchor="middle" class="detail">The API returns recent diagnostic records</text>
  <path d="M890 1210V1240M890 1310V1340M890 1410V1440" class="arrow"/>

  <rect x="55" y="1540" width="1090" height="58" rx="12" fill="#f7fcfb" stroke="#36a995" stroke-width="1.7"/>
  <text x="600" y="1564" text-anchor="middle" class="label">Local validation: Docker Compose, Prometheus, Grafana, Kubernetes, Terraform, Ansible and tests</text>
  <text x="600" y="1584" text-anchor="middle" class="small">Monitoring and Kubernetes are local tools; AWS runs one EC2 host with private single-AZ RDS.</text>
</svg>
