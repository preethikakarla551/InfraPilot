<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" viewBox="0 0 1100 980" role="img" aria-labelledby="title desc">
  <title id="title">InfraPilot application data flow</title>
  <desc id="desc">Requests pass from a browser through Nginx to FastAPI. Health responses return to the browser. Diagnostics are stored in MySQL or SQLite, and Prometheus reads metrics for Grafana.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#218a5b"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:28px;font-weight:700}.subtitle{font-size:14px;fill:#64748b}.label{font-size:15px;font-weight:700}.detail{font-size:12px;fill:#526174}.section{font-size:16px;font-weight:700}.arrow{fill:none;stroke:#64748b;stroke-width:2.3;marker-end:url(#arrow)}.blue{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#blueArrow)}.green{fill:none;stroke:#218a5b;stroke-width:2.4;marker-end:url(#greenArrow)}
    </style>
  </defs>
  <rect width="1100" height="980" fill="#fff"/>
  <text x="50" y="50" class="title">InfraPilot | Application data flow</text>
  <text x="50" y="78" class="subtitle">Request in → service processing → response, stored diagnostics and monitoring data</text>

  <rect x="365" y="112" width="370" height="68" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.8"/>
  <text x="550" y="140" text-anchor="middle" class="label">User / Browser</text>
  <text x="550" y="161" text-anchor="middle" class="detail">HTTP request: GET /health</text>
  <rect x="365" y="225" width="370" height="74" rx="12" fill="#fffaf2" stroke="#ed8b24" stroke-width="1.8"/>
  <text x="550" y="255" text-anchor="middle" class="label">Nginx reverse proxy on EC2</text>
  <text x="550" y="278" text-anchor="middle" class="detail">Public port 80 • permits only GET /health</text>
  <rect x="365" y="344" width="370" height="82" rx="12" fill="#f7fbff" stroke="#2376b7" stroke-width="1.8"/>
  <text x="550" y="375" text-anchor="middle" class="label">FastAPI application</text>
  <text x="550" y="399" text-anchor="middle" class="detail">Health • diagnostics • history • metrics</text>
  <path d="M550 180V225" class="blue"/><path d="M550 299V344" class="blue"/>

  <rect x="35" y="350" width="245" height="70" rx="12" fill="#fff8fb" stroke="#bc1356" stroke-width="1.8"/>
  <text x="157" y="380" text-anchor="middle" class="label">Administrator via SSM</text>
  <text x="157" y="402" text-anchor="middle" class="detail">Private access; no inbound SSH</text>
  <path d="M280 385H365" class="arrow"/>
  <text x="322" y="373" text-anchor="middle" class="detail">private API calls</text>

  <path d="M550 426V470H190V515M550 470V515M550 470H910V515" class="arrow"/>
  <rect x="35" y="515" width="310" height="340" rx="14" fill="#f8fbff" stroke="#8aa8cd" stroke-width="1.5"/>
  <rect x="395" y="515" width="310" height="340" rx="14" fill="#fbf9ff" stroke="#9b83c7" stroke-width="1.5"/>
  <rect x="755" y="515" width="310" height="340" rx="14" fill="#f7fcfb" stroke="#75b9ae" stroke-width="1.5"/>
  <text x="190" y="547" text-anchor="middle" class="section">HEALTH RESPONSE</text>
  <text x="550" y="547" text-anchor="middle" class="section">DIAGNOSTICS &amp; HISTORY</text>
  <text x="910" y="547" text-anchor="middle" class="section">METRICS MONITORING</text>

  <rect x="65" y="578" width="250" height="70" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="190" y="607" text-anchor="middle" class="label">GET /health</text>
  <text x="190" y="629" text-anchor="middle" class="detail">FastAPI health handler</text>
  <path d="M190 648V690" class="green"/>
  <rect x="65" y="690" width="250" height="74" rx="10" fill="#f7fff9" stroke="#4c9b70" stroke-width="1.5"/>
  <text x="190" y="720" text-anchor="middle" class="label">HTTP 200 health JSON</text>
  <text x="190" y="743" text-anchor="middle" class="detail">Response returns to the caller</text>
  <text x="190" y="804" text-anchor="middle" class="detail">Other public paths return 404</text>

  <rect x="425" y="578" width="250" height="70" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="550" y="607" text-anchor="middle" class="label">GET /diagnostics</text>
  <text x="550" y="629" text-anchor="middle" class="detail">Collect CPU, memory, disk and uptime</text>
  <path d="M550 648V679" class="arrow"/>
  <rect x="425" y="679" width="250" height="70" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="550" y="708" text-anchor="middle" class="label">Save diagnostic snapshot</text>
  <text x="550" y="730" text-anchor="middle" class="detail">AWS: private RDS MySQL</text>
  <text x="550" y="746" text-anchor="middle" class="detail">Local: SQLite</text>
  <path d="M550 749V778" class="arrow"/>
  <rect x="425" y="778" width="250" height="58" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="550" y="803" text-anchor="middle" class="label">GET /history</text>
  <text x="550" y="823" text-anchor="middle" class="detail">Read and return saved snapshots</text>

  <rect x="785" y="578" width="250" height="70" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="910" y="607" text-anchor="middle" class="label">GET /metrics</text>
  <text x="910" y="629" text-anchor="middle" class="detail">Prometheus-format host metrics</text>
  <path d="M910 648V690" class="arrow"/>
  <rect x="785" y="690" width="250" height="70" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="910" y="720" text-anchor="middle" class="label">Prometheus scrapes metrics</text>
  <text x="910" y="742" text-anchor="middle" class="detail">Local monitoring stack</text>
  <path d="M910 760V790" class="arrow"/>
  <rect x="785" y="790" width="250" height="48" rx="10" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="910" y="820" text-anchor="middle" class="label">Grafana displays dashboards</text>

  <rect x="110" y="890" width="880" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="550" y="912" text-anchor="middle" class="detail">Prometheus and Grafana run locally. In AWS, Nginx exposes only GET /health; diagnostic and metrics routes are private.</text>
  <text x="550" y="931" text-anchor="middle" class="detail">Diagnostics use MySQL in AWS and SQLite in local mode.</text>
</svg>
