apiVersion: v1
kind: ConfigMap
metadata:
  name: infrapilot-config
  namespace: infrapilot
data:
  INFRAPILOT_DB: /data/infrapilot.db
---
apiVersion: v1
kind: Secret
metadata:
  name: infrapilot-demo-secret
  namespace: infrapilot
type: Opaque
stringData:
  MYSQL_PASSWORD: replace-before-sharing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infrapilot
  namespace: infrapilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infrapilot
  template:
    metadata:
      labels:
        app: infrapilot
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: infrapilot:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: INFRAPILOT_DB
              valueFrom:
                configMapKeyRef:
                  name: infrapilot-config
                  key: INFRAPILOT_DB
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: infrapilot
  namespace: infrapilot
spec:
  selector:
    app: infrapilot
  ports:
    - port: 8000
      targetPort: 8000
